<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 389" role="img" aria-labelledby="title desc"><title id="title">HDR Studio : trois niveaux de lecture</title><desc id="desc">Ouvrir les en-têtes, lire les métadonnées dynamiques puis mesurer les pixels avec mvo-fel compatible.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L0 8 L8 4 Z" fill="#95a8c9"/></marker></defs><rect width="1100" height="389" rx="22" fill="#101827"/><g font-family="DejaVu Sans, Segoe UI, Arial, sans-serif"><text x="36" y="47" text-anchor="start" font-size="25" font-weight="700" fill="#ffffff">HDR Studio : trois niveaux de lecture</text><text x="36" y="79" text-anchor="start" font-size="16" font-weight="400" fill="#9aacc9">Chaque niveau complète le précédent ; choisissez le travail nécessaire.</text><rect x="36" y="117" width="298" height="240" rx="16" fill="#19243a" stroke="#33435e"/><text x="185" y="154" text-anchor="middle" font-size="22" font-weight="700" fill="#96abff">01</text><text x="185" y="192" text-anchor="middle" font-size="19" font-weight="600" fill="#ffffff">Ouvrir la source</text><text x="185" y="232" text-anchor="middle" font-size="17" font-weight="400" fill="#d9e2f5">Formats HDR, piste</text><text x="185" y="258" text-anchor="middle" font-size="17" font-weight="400" fill="#d9e2f5">et en-têtes déclarés</text><text x="185" y="307" text-anchor="middle" font-size="15" font-weight="400" fill="#96abff">Lecture initiale</text><text x="185" y="331" text-anchor="middle" font-size="15" font-weight="400" fill="#96abff">Sans extension FEL</text><path d="M346 237 L386 237" fill="none" stroke="#95a8c9" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="401" y="117" width="298" height="240" rx="16" fill="#19243a" stroke="#33435e"/><text x="550" y="154" text-anchor="middle" font-size="22" font-weight="700" fill="#f6c770">02</text><text x="550" y="192" text-anchor="middle" font-size="19" font-weight="600" fill="#ffffff">Lire les métadonnées</text><text x="550" y="232" text-anchor="middle" font-size="17" font-weight="400" fill="#d9e2f5">RPU, HDR10+</text><text x="550" y="258" text-anchor="middle" font-size="17" font-weight="400" fill="#d9e2f5">courbes et cohérence</text><text x="550" y="307" text-anchor="middle" font-size="15" font-weight="400" fill="#f6c770">Parcourt le fichier</text><text x="550" y="331" text-anchor="middle" font-size="15" font-weight="400" fill="#f6c770">Sans décoder l’image</text><path d="M711 237 L751 237" fill="none" stroke="#95a8c9" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="766" y="117" width="298" height="240" rx="16" fill="#19243a" stroke="#33435e"/><text x="915" y="154" text-anchor="middle" font-size="22" font-weight="700" fill="#74e3b3">03</text><text x="915" y="192" text-anchor="middle" font-size="19" font-weight="600" fill="#ffffff">Mesurer l’image</text><text x="915" y="232" text-anchor="middle" font-size="17" font-weight="400" fill="#d9e2f5">Luminance des pixels</text><text x="915" y="258" text-anchor="middle" font-size="17" font-weight="400" fill="#d9e2f5">MaxCLL / MaxFALL</text><text x="915" y="307" text-anchor="middle" font-size="15" font-weight="400" fill="#74e3b3">HEVC PQ</text><text x="915" y="331" text-anchor="middle" font-size="15" font-weight="400" fill="#74e3b3">mvo-fel ≥ 0.4.0</text></g></svg>
