<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 424" role="img" aria-labelledby="title desc"><title id="title">Où intervient Merge FEL ?</title><desc id="desc">La couche de base, les courbes RPU et le résiduel FEL servent à reconstruire l’image avant les filtres, l’interpolation et l’encodage.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L0 8 L8 4 Z" fill="#95a8c9"/></marker></defs><rect width="1100" height="424" rx="22" fill="#101827"/><g font-family="DejaVu Sans, Segoe UI, Arial, sans-serif"><text x="36" y="47" text-anchor="start" font-size="25" font-weight="700" fill="#ffffff">Où intervient Merge FEL ?</text><text x="36" y="79" text-anchor="start" font-size="16" font-weight="400" fill="#9aacc9">Le résiduel FEL est intégré à l’image avant ses transformations.</text><rect x="36" y="112" width="246" height="77" rx="16" fill="#19243a" stroke="#33435e"/><text x="159" y="141" text-anchor="middle" font-size="18" font-weight="700" fill="#96abff">BL</text><text x="159" y="169" text-anchor="middle" font-size="15" font-weight="400" fill="#d9e2f5">Couche de base</text><path d="M294 150 L362 252" fill="none" stroke="#95a8c9" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="36" y="213" width="246" height="77" rx="16" fill="#19243a" stroke="#33435e"/><text x="159" y="242" text-anchor="middle" font-size="18" font-weight="700" fill="#f6c770">RPU</text><text x="159" y="270" text-anchor="middle" font-size="15" font-weight="400" fill="#d9e2f5">Courbes Dolby Vision</text><path d="M294 251 L362 252" fill="none" stroke="#95a8c9" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="36" y="314" width="246" height="77" rx="16" fill="#19243a" stroke="#33435e"/><text x="159" y="343" text-anchor="middle" font-size="18" font-weight="700" fill="#74e3b3">FEL</text><text x="159" y="371" text-anchor="middle" font-size="15" font-weight="400" fill="#d9e2f5">Résiduel d’amélioration</text><path d="M294 352 L362 252" fill="none" stroke="#95a8c9" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="374" y="190" width="220" height="124" rx="16" fill="#19243a" stroke="#74e3b3"/><text x="484" y="231" text-anchor="middle" font-size="21" font-weight="700" fill="#d9e2f5">Reconstruction</text><text x="484" y="261" text-anchor="middle" font-size="21" font-weight="700" fill="#d9e2f5">de l’image</text><text x="484" y="289" text-anchor="middle" font-size="15" font-weight="400" fill="#74e3b3">CPU / GPU</text><path d="M607 252 L654 252" fill="none" stroke="#95a8c9" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="668" y="190" width="172" height="124" rx="16" fill="#19243a" stroke="#33435e"/><text x="754" y="230" text-anchor="middle" font-size="18" font-weight="600" fill="#d9e2f5">Filtres</text><text x="754" y="257" text-anchor="middle" font-size="18" font-weight="600" fill="#d9e2f5">Interpolation</text><path d="M853 252 L891 252" fill="none" stroke="#95a8c9" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="904" y="190" width="160" height="124" rx="16" fill="#19243a" stroke="#33435e"/><text x="984" y="230" text-anchor="middle" font-size="18" font-weight="600" fill="#d9e2f5">Encodage</text><text x="984" y="257" text-anchor="middle" font-size="18" font-weight="600" fill="#d9e2f5">vidéo</text><text x="675" y="367" text-anchor="middle" font-size="17" font-weight="400" fill="#f6c770">Conserver le RPU en sortie reste un choix séparé.</text></g></svg>
