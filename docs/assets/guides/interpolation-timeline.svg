<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 422" role="img" aria-labelledby="title desc"><title id="title">Plus d’images, sans accélérer le film</title><desc id="desc">Une suite d’images source et les images intermédiaires ajoutées entre elles sur la même durée.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L0 8 L8 4 Z" fill="#95a8c9"/></marker></defs><rect width="1100" height="422" rx="22" fill="#101827"/><g font-family="DejaVu Sans, Segoe UI, Arial, sans-serif"><text x="36" y="47" text-anchor="start" font-size="25" font-weight="700" fill="#ffffff">Plus d’images, sans accélérer le film</text><text x="36" y="79" text-anchor="start" font-size="16" font-weight="400" fill="#9aacc9">Exemple ×2 : une image créée entre deux images source.</text><text x="38" y="127" text-anchor="start" font-size="17" font-weight="400" fill="#9aacc9">Source</text><text x="38" y="261" text-anchor="start" font-size="17" font-weight="400" fill="#9aacc9">Sortie ×2</text><rect x="179" y="103" width="132" height="80" rx="16" fill="#19243a" stroke="#96abff"/><circle cx="210" cy="143" r="13" fill="#96abff"/><text x="245" y="207" text-anchor="middle" font-size="14" font-weight="400" fill="#9aacc9">0t</text><rect x="519" y="103" width="132" height="80" rx="16" fill="#19243a" stroke="#96abff"/><circle cx="585" cy="143" r="13" fill="#96abff"/><text x="585" y="207" text-anchor="middle" font-size="14" font-weight="400" fill="#9aacc9">1t</text><rect x="859" y="103" width="132" height="80" rx="16" fill="#19243a" stroke="#96abff"/><circle cx="960" cy="143" r="13" fill="#96abff"/><text x="925" y="207" text-anchor="middle" font-size="14" font-weight="400" fill="#9aacc9">2t</text><rect x="179" y="236" width="132" height="80" rx="16" fill="#19243a" stroke="#96abff"/><circle cx="210.0" cy="276" r="13" fill="#96abff"/><rect x="349" y="236" width="132" height="80" rx="16" fill="#19243a" stroke="#74e3b3"/><circle cx="397.5" cy="276" r="13" fill="#74e3b3"/><text x="415" y="338" text-anchor="middle" font-size="14" font-weight="400" fill="#74e3b3">Créée</text><rect x="519" y="236" width="132" height="80" rx="16" fill="#19243a" stroke="#96abff"/><circle cx="585.0" cy="276" r="13" fill="#96abff"/><rect x="689" y="236" width="132" height="80" rx="16" fill="#19243a" stroke="#74e3b3"/><circle cx="772.5" cy="276" r="13" fill="#74e3b3"/><text x="755" y="338" text-anchor="middle" font-size="14" font-weight="400" fill="#74e3b3">Créée</text><rect x="859" y="236" width="132" height="80" rx="16" fill="#19243a" stroke="#96abff"/><circle cx="960.0" cy="276" r="13" fill="#96abff"/><text x="550" y="391" text-anchor="middle" font-size="19" font-weight="600" fill="#d9e2f5">Même durée du film et de l’audio ; davantage d’images.</text></g></svg>
