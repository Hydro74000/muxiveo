<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc"><title id="title">Copier, encoder ou corriger les métadonnées ?</title><desc id="desc">Trois parcours : organiser les pistes en copie, modifier les pixels par encodage ou corriger les métadonnées dans HDR Studio.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L0 8 L8 4 Z" fill="#95a8c9"/></marker></defs><rect width="1100" height="470" rx="22" fill="#101827"/><g font-family="DejaVu Sans, Segoe UI, Arial, sans-serif"><text x="36" y="47" text-anchor="start" font-size="25" font-weight="700" fill="#ffffff">Copier, encoder ou corriger les métadonnées ?</text><text x="36" y="79" text-anchor="start" font-size="16" font-weight="400" fill="#9aacc9">Choisir le traitement selon ce qui doit changer.</text><rect x="36" y="112" width="292" height="76" rx="16" fill="#19243a" stroke="#33435e"/><rect x="398" y="112" width="302" height="76" rx="16" fill="#19243a" stroke="#33435e"/><rect x="770" y="112" width="294" height="76" rx="16" fill="#19243a" stroke="#33435e"/><text x="182" y="157" text-anchor="middle" font-size="18" font-weight="600" fill="#74e3b3">Organiser les pistes</text><text x="549" y="157" text-anchor="middle" font-size="18" font-weight="600" fill="#d9e2f5">Conteneur + Copy</text><text x="917" y="157" text-anchor="middle" font-size="17" font-weight="400" fill="#d9e2f5">Image sans recompression</text><path d="M340 150 L386 150" fill="none" stroke="#95a8c9" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M712 150 L758 150" fill="none" stroke="#95a8c9" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="36" y="212" width="292" height="76" rx="16" fill="#19243a" stroke="#33435e"/><rect x="398" y="212" width="302" height="76" rx="16" fill="#19243a" stroke="#33435e"/><rect x="770" y="212" width="294" height="76" rx="16" fill="#19243a" stroke="#33435e"/><text x="182" y="257" text-anchor="middle" font-size="18" font-weight="600" fill="#96abff">Modifier les pixels</text><text x="549" y="257" text-anchor="middle" font-size="18" font-weight="600" fill="#d9e2f5">Encodage</text><text x="917" y="257" text-anchor="middle" font-size="17" font-weight="400" fill="#d9e2f5">Image réencodée</text><path d="M340 250 L386 250" fill="none" stroke="#95a8c9" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M712 250 L758 250" fill="none" stroke="#95a8c9" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="36" y="312" width="292" height="76" rx="16" fill="#19243a" stroke="#33435e"/><rect x="398" y="312" width="302" height="76" rx="16" fill="#19243a" stroke="#33435e"/><rect x="770" y="312" width="294" height="76" rx="16" fill="#19243a" stroke="#33435e"/><text x="182" y="357" text-anchor="middle" font-size="18" font-weight="600" fill="#f6c770">Corriger le HDR déclaré</text><text x="549" y="357" text-anchor="middle" font-size="18" font-weight="600" fill="#d9e2f5">HDR Studio · Édition</text><text x="917" y="357" text-anchor="middle" font-size="17" font-weight="400" fill="#d9e2f5">Métadonnées corrigées</text><path d="M340 350 L386 350" fill="none" stroke="#95a8c9" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M712 350 L758 350" fill="none" stroke="#95a8c9" stroke-width="2.5" marker-end="url(#arrow)"/><text x="550" y="440" text-anchor="middle" font-size="17" font-weight="400" fill="#9aacc9">Filtres, interpolation et reconstruction FEL demandent un réencodage vidéo.</text></g></svg>
