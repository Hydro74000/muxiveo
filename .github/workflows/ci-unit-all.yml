name: Unit Tests (all)

# Suite générale : tout fichier tests/test_*.py est collecté, sans liste
# manuelle à maintenir. Appelée par release.yml à chaque push de branche ou
# de tag : aucune publication sans ces contrôles verts sur le même commit.
on:
  workflow_dispatch:
  workflow_call:
  pull_request:

jobs:
  lint:
    name: Ruff + Mypy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff mypy

      - name: Ruff
        run: >-
          python -m ruff check --output-format concise
          core cli ui workers main.py launcher.py setup.py setup_brew.py
          package.py package_appimage.py

      - name: Mypy
        run: python -m mypy core cli ui workers main.py launcher.py

  linux:
    name: Linux / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.10"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install system dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            ffmpeg mediainfo g++
            libegl1 libgl1 libglib2.0-0 libdbus-1-3
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
            libxkbcommon-x11-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-qt

      - name: Run all unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        # -rs : chaque test ignoré (outil, GPU, plateforme) est listé avec sa raison.
        run: >-
          python -m pytest -q -rs tests
          -W error::pytest.PytestUnhandledThreadExceptionWarning
          --junitxml=pytest-linux-${{ matrix.python }}.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-linux-${{ matrix.python }}
          path: pytest-linux-${{ matrix.python }}.xml
          if-no-files-found: ignore

  windows:
    name: Windows / contrats plateforme
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-qt

      # Qt réel (pas le bootstrap simulé) : verrous msvcrt, aperçus cmd.exe
      # réellement exécutés, propriété des fichiers et chemins Windows.
      - name: Run Windows platform tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m pytest -q -rs
          -W error::pytest.PytestUnhandledThreadExceptionWarning
          tests/test_encode_preview_quoting.py
          tests/test_output_commit.py
          tests/test_workdir_ownership.py
          tests/test_cli_batch_collisions.py
          tests/test_profile_store.py
          tests/test_json_documents.py
          tests/test_probe_lifecycle.py
          tests/test_optional_capability_detection.py
          tests/test_windows_pytest_bootstrap.py
          tests/test_python_requirements.py
          tests/test_qt_binding_sanity.py
          tests/test_shutdown_cleanup.py::test_sync_studio_cancels_audio_and_keeps_resources_until_worker_finishes
          --junitxml=pytest-windows.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-windows
          path: pytest-windows.xml
          if-no-files-found: ignore
