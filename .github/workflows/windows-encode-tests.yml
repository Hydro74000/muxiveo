name: Windows Encode Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "core/workflows/encode/**"
      - "tests/test_encode_hw_devices.py"
      - "tests/test_encode_hardware.py"
      - "tests/test_encode_workflow.py"
      - "tests/conftest.py"
      - "scripts/windows_pytest_bootstrap.py"
      - "requirements.txt"
      - "core/python_requirements.py"
      - ".github/workflows/windows-encode-tests.yml"
  push:
    branches:
      - main
      - master
      - rebrand
      - devel-cli
    paths:
      - "core/workflows/encode/**"
      - "tests/test_encode_hw_devices.py"
      - "tests/test_encode_hardware.py"
      - "tests/test_encode_workflow.py"
      - "tests/conftest.py"
      - "scripts/windows_pytest_bootstrap.py"
      - "requirements.txt"
      - "core/python_requirements.py"
      - ".github/workflows/windows-encode-tests.yml"

jobs:
  encode-targeted:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Test Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-qt

      - name: Install FFmpeg master
        uses: ./.github/actions/ffmpeg-master

      - name: Run Targeted Encode Tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/windows_pytest_bootstrap.py `
            tests/test_encode_hw_devices.py `
            tests/test_encode_hardware.py `
            tests/test_encode_workflow.py
