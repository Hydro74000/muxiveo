name: Rebuild existing macOS 5.1.1 assets
run-name: macOS 5.1.1 — ${{ inputs.mode }}
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [build, publish]
        default: build
        required: true
      build_run_id:
        description: Successful build run to publish
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: macos-5.1.1-repair
  cancel-in-progress: false
jobs:
  build-macos:
    if: inputs.mode == 'build'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packaging and test dependencies
        run: python -m pip install -r requirements.txt pyinstaller pillow pytest pytest-qt
      - name: Test final signing and refusal of an invalid signature
        run: python -m pytest -q tests/test_package.py -k test_build_macos_seals_final_bundle_before_distribution
      - name: Embed stable version and build
        run: |
          python -c 'from pathlib import Path; Path("core/_build_version.py").write_text("BUILD_VERSION = \"5.1.1\"\n")'
          python package.py --dmg --version 5.1.1
      - name: Package all three macOS distributions
        run: |
          mkdir -p release-assets
          cp dist/releases/Muxiveo-5.1.1.dmg release-assets/
          (cd dist && zip -qr --symlinks ../release-assets/Muxiveo-5.1.1-macos.zip Muxiveo.app)
          tar -C dist -czf release-assets/Muxiveo-5.1.1-homebrew-macos.tar.gz Muxiveo.app
      - name: Verify signed app from the DMG, ZIP and Homebrew archive
        shell: bash
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 dist/Muxiveo.app
          archs="$(lipo -archs dist/Muxiveo.app/Contents/MacOS/muxiveo)"
          test "$archs" = arm64
          file dist/Muxiveo.app/Contents/MacOS/muxiveo
          mkdir -p "$RUNNER_TEMP/macos-dmg-check" "$RUNNER_TEMP/macos-zip-check" "$RUNNER_TEMP/macos-tar-check"
          hdiutil attach release-assets/Muxiveo-5.1.1.dmg -nobrowse -readonly -mountpoint "$RUNNER_TEMP/macos-dmg-check"
          trap 'hdiutil detach "$RUNNER_TEMP/macos-dmg-check" || true' EXIT
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/macos-dmg-check/Muxiveo.app"
          version="$("$RUNNER_TEMP/macos-dmg-check/Muxiveo.app/Contents/MacOS/muxiveo" --cli version)"
          test "$version" = 'Muxiveo 5.1.1'
          hdiutil detach "$RUNNER_TEMP/macos-dmg-check"
          trap - EXIT
          ditto -x -k release-assets/Muxiveo-5.1.1-macos.zip "$RUNNER_TEMP/macos-zip-check"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/macos-zip-check/Muxiveo.app"
          tar -xzf release-assets/Muxiveo-5.1.1-homebrew-macos.tar.gz -C "$RUNNER_TEMP/macos-tar-check"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/macos-tar-check/Muxiveo.app"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = {'version': '5.1.1', 'source_sha': os.environ['GITHUB_SHA'], 'architecture': 'arm64',
                    'codesign_deep_strict': True, 'verified': ['app', 'dmg', 'zip', 'homebrew'],
                    'dmg_cli_version': 'Muxiveo 5.1.1', 'notarized': False}
          Path('release-assets/macos-validation.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: macos-5.1.1-rebuilt
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
  publish-macos:
    if: inputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Require a successful build of this exact source
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          run_id = os.environ['BUILD_RUN_ID']
          assert re.fullmatch(r'[0-9]+', run_id), 'Invalid build run ID'
          run = json.loads(subprocess.check_output(['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}']))
          assert run['conclusion'] == 'success' and run['status'] == 'completed', run
          assert run['head_sha'] == os.environ['GITHUB_SHA'], 'Build source differs from publication source'
          assert run['event'] == 'workflow_dispatch' and run['path'] == '.github/workflows/release.yml'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: macos-5.1.1-rebuilt
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: release-assets
      - name: Replace existing assets and synchronize checksums
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
        run: python3 scripts/replace_macos_511_assets.py
      - name: Preserve publication metadata and validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-5.1.1-publication-metadata
          path: |
            publication-backup/*
            publication-result.json
            release-assets/macos-validation.json
          retention-days: 30
