name: Build and Release

on:
  push:
    branches:
      - devel-cli
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (ex: 3.1.0 or v3.1.0). Empty uses APP_VERSION."
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || format('{0}/homebrew-Muxiveo', github.repository_owner) }}

jobs:
  release-metadata:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.metadata.outputs.package_version }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      release_name: ${{ steps.metadata.outputs.release_name }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      channel: ${{ steps.metadata.outputs.channel }}
      appimage_update_release: ${{ steps.metadata.outputs.appimage_update_release }}
    steps:
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach --force "$CHECKOUT_SHA"

      - name: Compute release identity
        id: metadata
        shell: bash
        env:
          RELEASE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        run: |
          set -euo pipefail

          base_version="$(python -c 'from core.version import APP_VERSION; print(APP_VERSION)')"
          input_version="$(python -c 'import os; print(os.environ["RELEASE_INPUT"].strip())')"

          normalize_version() {
            local value="$1"
            value="${value#v}"
            value="${value#V}"
            printf '%s' "$value"
          }

          if [ -n "$input_version" ]; then
            package_version="$(normalize_version "$input_version")"
            channel="stable"
            prerelease="false"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            package_version="$(normalize_version "${GITHUB_REF_NAME}")"
            channel="stable"
            prerelease="false"
          elif [ "${GITHUB_REF_TYPE:-}" = "branch" ] && [ "${GITHUB_REF_NAME:-}" = "main" ]; then
            package_version="$base_version"
            channel="stable"
            prerelease="false"
          elif [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ]; then
            package_version="$base_version"
            channel="stable"
            prerelease="false"
          else
            date_id="$(date -u +%Y%m%d)"
            short_sha="$(git rev-parse --short=7 HEAD)"
            package_version="${base_version}-unstable.${date_id}.${GITHUB_RUN_NUMBER}.${short_sha}"
            channel="unstable"
            prerelease="true"
          fi

          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Invalid package version" >&2
            exit 1
          fi

          if [ "$channel" = "stable" ]; then
            release_tag="v${package_version}"
            release_name="Muxiveo ${package_version}"
            appimage_update_release="latest"
          else
            release_tag="v${package_version}"
            release_name="Unstable ${release_tag}"
            appimage_update_release="latest-pre"
          fi

          {
            echo "package_version=$package_version"
            echo "release_tag=$release_tag"
            echo "release_name=$release_name"
            echo "prerelease=$prerelease"
            echo "channel=$channel"
            echo "appimage_update_release=$appimage_update_release"
          } >> "$GITHUB_OUTPUT"

  muxiveo-rife-state:
    name: muxiveo-rife release state
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.state.outputs.build }}
      tag: ${{ steps.state.outputs.tag }}
    steps:
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach --force "$CHECKOUT_SHA"

      # Release de la version épinglée absente -> compilation + publication avant le
      # packaging. Présente -> le code natif doit être identique à celui publié.
      - name: Resolve state
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^project(muxiveo-rife VERSION \([0-9.]*\).*/\1/p' native/muxiveo-rife/CMakeLists.txt)
          PINNED=$(sed -n 's/^MUXIVEO_RIFE_VERSION = "\([0-9.]*\)"/\1/p' core/version.py)
          if [ -z "$VERSION" ] || [ "$VERSION" != "$PINNED" ]; then
            echo "::error::Version muxiveo-rife incohérente : CMakeLists.txt ($VERSION) != core/version.py ($PINNED)"
            exit 1
          fi
          TAG="muxiveo-rife-v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::${TAG} absente : compilation et publication avant le packaging"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
          NATIVE=(native/muxiveo-rife/src native/muxiveo-rife/cmake native/muxiveo-rife/CMakeLists.txt
                  native/muxiveo-rife/models.json native/muxiveo-rife/scripts)
          if ! git diff --quiet "$TAG" HEAD -- "${NATIVE[@]}"; then
            echo "::error::Code natif modifié depuis ${TAG} : incrémenter la version (native/muxiveo-rife/CMakeLists.txt + MUXIVEO_RIFE_VERSION de core/version.py)"
            git diff --stat "$TAG" HEAD -- "${NATIVE[@]}"
            exit 1
          fi
          echo "build=false" >> "$GITHUB_OUTPUT"

  muxiveo-rife:
    name: muxiveo-rife
    needs: muxiveo-rife-state
    if: ${{ needs.muxiveo-rife-state.outputs.build == 'true' }}
    uses: ./.github/workflows/muxiveo-rife.yml
    with:
      publish: true

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    # muxiveo-rife embarqué : release publiée (ou déjà existante) avant le packaging
    needs: [release-metadata, muxiveo-rife-state, muxiveo-rife]
    if: ${{ !cancelled() && needs.release-metadata.result == 'success' && needs.muxiveo-rife-state.result == 'success' && (needs.muxiveo-rife.result == 'success' || needs.muxiveo-rife.result == 'skipped') }}
    steps:
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach --force "$CHECKOUT_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y squashfs-tools zsync
          python -m pip install --upgrade pip
          pip install "PySide6>=6.6.0" "pymediainfo>=6.1.0" "numpy>=1.24" certifi pyinstaller

      - name: Embed build version
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.release-metadata.outputs.package_version }}
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          Path("core/_build_version.py").write_text(
              "BUILD_VERSION = " + repr(os.environ["PACKAGE_VERSION"]) + "\n", encoding="utf-8"
          )
          PYTHON

      - name: Build all-inclusive AppImage
        env:
          PACKAGE_VERSION: ${{ needs.release-metadata.outputs.package_version }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          MUXIVEO_APPIMAGE_UPDATE_RELEASE: ${{ needs.release-metadata.outputs.appimage_update_release }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python package_appimage.py --allinc --version "$PACKAGE_VERSION"

      - name: Collect Linux assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/linux
          cp dist/releases/Muxiveo-x86_64_allinc-*.AppImage release-assets/linux/
          cp dist/releases/Muxiveo-x86_64_allinc-*.AppImage.zsync release-assets/linux/
          ls -la release-assets/linux

      - name: Upload Linux assets
        uses: actions/upload-artifact@v4
        with:
          name: appimage-linux
          path: release-assets/linux/*
          if-no-files-found: error

  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    # muxiveo-rife embarqué : release publiée (ou déjà existante) avant le packaging
    needs: [release-metadata, muxiveo-rife-state, muxiveo-rife]
    if: ${{ !cancelled() && needs.release-metadata.result == 'success' && needs.muxiveo-rife-state.result == 'success' && (needs.muxiveo-rife.result == 'success' || needs.muxiveo-rife.result == 'skipped') }}
    steps:
      - name: Checkout
        shell: pwsh
        env:
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          git init .
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$env:CHECKOUT_SHA"
          git checkout --detach --force "$env:CHECKOUT_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install "PySide6>=6.6.0" "pymediainfo>=6.1.0" "numpy>=1.24" certifi pyinstaller

      - name: Install NSIS
        shell: pwsh
        run: |
          winget install --id NSIS.NSIS -e --silent --accept-source-agreements --accept-package-agreements

      - name: Embed build version
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.release-metadata.outputs.package_version }}
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          Path("core/_build_version.py").write_text(
              "BUILD_VERSION = " + repr(os.environ["PACKAGE_VERSION"]) + "\n", encoding="utf-8"
          )
          PYTHON

      - name: Build all-inclusive PyInstaller and NSIS package
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.release-metadata.outputs.package_version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python package.py --nsis --allinc --portable --version "$env:PACKAGE_VERSION"

      - name: Collect Windows assets
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.release-metadata.outputs.package_version }}
        run: |
          $version = $env:PACKAGE_VERSION
          $std_file = "dist\releases\Muxiveo-Setup-$version.exe"
          $allinc_file = "dist\releases\Muxiveo-Setup-AllInc-$version.exe"
          $portable_file = "dist\releases\Muxiveo-Windows-x64-allinc-$version.zip"
          if (-not (Test-Path $std_file)) {
            Get-ChildItem -Recurse dist | Select-Object -First 200 FullName
            throw "Standard Windows installer not found: $std_file"
          }
          if (-not (Test-Path $allinc_file)) {
            Get-ChildItem -Recurse dist | Select-Object -First 200 FullName
            throw "AllInc Windows installer not found: $allinc_file"
          }
          if (-not (Test-Path $portable_file)) {
            Get-ChildItem -Recurse dist | Select-Object -First 200 FullName
            throw "Portable Windows ZIP not found: $portable_file"
          }
          New-Item -ItemType Directory -Force -Path release-assets\windows | Out-Null
          Get-ChildItem -Path dist\releases -Filter "*$version*" | Copy-Item -Destination release-assets\windows\ -Force
          Get-ChildItem release-assets\windows

      - name: Upload Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: binary-windows
          path: release-assets/windows/*
          if-no-files-found: error

  build-macos:
    name: Build macOS packages
    runs-on: macos-latest
    needs: release-metadata
    steps:
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach --force "$CHECKOUT_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install macOS packaging dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "PySide6>=6.6.0" "pymediainfo>=6.1.0" "numpy>=1.24" certifi pyinstaller pillow

      - name: Embed build version
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.release-metadata.outputs.package_version }}
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          Path("core/_build_version.py").write_text(
              "BUILD_VERSION = " + repr(os.environ["PACKAGE_VERSION"]) + "\n", encoding="utf-8"
          )
          PYTHON

      - name: Build macOS app and DMG
        env:
          PACKAGE_VERSION: ${{ needs.release-metadata.outputs.package_version }}
        run: |
          python package.py --dmg --version "$PACKAGE_VERSION"

      - name: Collect macOS assets
        shell: bash
        env:
          VERSION: ${{ needs.release-metadata.outputs.package_version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets/macos

          cp "dist/releases/Muxiveo-${VERSION}.dmg" release-assets/macos/
          (cd dist && zip -qr --symlinks "../release-assets/macos/Muxiveo-${VERSION}-macos.zip" Muxiveo.app)

          ls -la release-assets/macos

      - name: Collect Homebrew macOS asset
        if: ${{ needs.release-metadata.outputs.channel == 'stable' && (github.ref_name == 'main' || github.ref_type == 'tag') }}
        shell: bash
        env:
          VERSION: ${{ needs.release-metadata.outputs.package_version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets/homebrew
          tar -C dist -czf "release-assets/homebrew/Muxiveo-${VERSION}-homebrew-macos.tar.gz" Muxiveo.app
          ls -la release-assets/homebrew

      - name: Upload macOS assets
        uses: actions/upload-artifact@v4
        with:
          name: binary-macos
          path: release-assets/macos/*
          if-no-files-found: error

      - name: Upload Homebrew macOS asset
        if: ${{ needs.release-metadata.outputs.channel == 'stable' && (github.ref_name == 'main' || github.ref_type == 'tag') }}
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-macos-assets
          path: release-assets/homebrew/*
          if-no-files-found: error

  homebrew-formula:
    name: Generate Homebrew formula
    runs-on: ubuntu-latest
    if: ${{ needs.release-metadata.outputs.channel == 'stable' && (github.ref_name == 'main' || github.ref_type == 'tag') }}
    needs:
      - release-metadata
      - build-linux
      - build-macos
    steps:
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach --force "$CHECKOUT_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download Linux assets
        uses: actions/download-artifact@v4
        with:
          name: appimage-linux
          path: release-assets/linux

      - name: Download Homebrew macOS asset
        uses: actions/download-artifact@v4
        with:
          name: homebrew-macos-assets
          path: release-assets/macos

      - name: Resolve external macOS tool assets
        id: tools
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || '' }}
        run: |
          set -euo pipefail
          DOVI_JSON=$(python scripts/github_release_asset.py --repo quietvoid/dovi_tool --pattern universal-macOS.zip --sha256)
          HDR_JSON=$(python scripts/github_release_asset.py --repo quietvoid/hdr10plus_tool --pattern universal-macOS.zip --sha256)
          echo "dovi_json=$DOVI_JSON" >> "$GITHUB_OUTPUT"
          echo "hdr_json=$HDR_JSON" >> "$GITHUB_OUTPUT"
          RIFE_TAG=$(python -c "from core.version import MUXIVEO_RIFE_RELEASE_TAG as t; print(t)")
          RIFE_JSON=$(python scripts/github_release_asset.py --repo "$GITHUB_REPOSITORY" --tag "$RIFE_TAG" --pattern macos-arm64.tar.gz --sha256 || echo '{}')
          echo "rife_json=$RIFE_JSON" >> "$GITHUB_OUTPUT"

      - name: Generate Homebrew formula
        shell: bash
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.release-metadata.outputs.package_version }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
          DOVI_JSON: ${{ steps.tools.outputs.dovi_json }}
          HDR_JSON: ${{ steps.tools.outputs.hdr_json }}
          RIFE_JSON: ${{ steps.tools.outputs.rife_json }}
        run: |
          set -euo pipefail
          mkdir -p release-assets/formula
          LINUX_FILE=$(basename "$(find release-assets/linux -maxdepth 1 -type f -name '*.AppImage' | head -1)")
          MACOS_FILE=$(basename "$(find release-assets/macos -maxdepth 1 -type f -name '*.tar.gz' | head -1)")
          LINUX_SHA=$(sha256sum "release-assets/linux/${LINUX_FILE}" | awk '{print $1}')
          MACOS_SHA=$(sha256sum "release-assets/macos/${MACOS_FILE}" | awk '{print $1}')
          DOVI_URL=$(python -c 'import json, os; print(json.loads(os.environ["DOVI_JSON"])["url"])')
          DOVI_SHA=$(python -c 'import json, os; print(json.loads(os.environ["DOVI_JSON"])["sha256"])')
          HDR_URL=$(python -c 'import json, os; print(json.loads(os.environ["HDR_JSON"])["url"])')
          HDR_SHA=$(python -c 'import json, os; print(json.loads(os.environ["HDR_JSON"])["sha256"])')
          python scripts/render_homebrew_formula.py \
            --version "$VERSION" \
            --linux-url "https://github.com/${REPO}/releases/download/${RELEASE_TAG}/${LINUX_FILE}" \
            --linux-sha256 "$LINUX_SHA" \
            --macos-url "https://github.com/${REPO}/releases/download/${RELEASE_TAG}/${MACOS_FILE}" \
            --macos-sha256 "$MACOS_SHA" \
            --dovi-tool-macos-url "$DOVI_URL" \
            --dovi-tool-macos-sha256 "$DOVI_SHA" \
            --hdr10plus-tool-macos-url "$HDR_URL" \
            --hdr10plus-tool-macos-sha256 "$HDR_SHA" \
            --homepage "https://github.com/${REPO}" \
            --muxiveo-rife-macos-url "$(python -c 'import json, os; print(json.loads(os.environ.get("RIFE_JSON") or "{}").get("url", ""))')" \
            --muxiveo-rife-macos-sha256 "$(python -c 'import json, os; print(json.loads(os.environ.get("RIFE_JSON") or "{}").get("sha256", ""))')" \
            --output release-assets/formula/Muxiveo.rb

      - name: Upload formula artifact
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: release-assets/formula/Muxiveo.rb
          if-no-files-found: error

  release:
    name: Create or update GitHub Release
    runs-on: ubuntu-latest
    if: ${{ always() && needs.release-metadata.result == 'success' && needs.build-linux.result == 'success' && needs.build-windows.result == 'success' && needs.build-macos.result == 'success' && (needs.homebrew-formula.result == 'success' || needs.homebrew-formula.result == 'skipped') }}
    needs:
      - release-metadata
      - build-linux
      - build-windows
      - build-macos
      - homebrew-formula
    steps:
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "$CHECKOUT_SHA"
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          git checkout --detach --force "$CHECKOUT_SHA"

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Add source archives
        shell: bash
        env:
          VERSION: ${{ needs.release-metadata.outputs.package_version }}
        run: |
          set -euo pipefail
          PREFIX="Muxiveo-${VERSION}"
          git archive --format=tar --prefix="${PREFIX}/" HEAD | gzip -9 > "artifacts/${PREFIX}-source.tar.gz"
          git archive --format=zip --prefix="${PREFIX}/" HEAD -o "artifacts/${PREFIX}-source.zip"
          ls -la artifacts

      # Sommes SHA-256 de tous les assets : requises par la mise à jour intégrée
      # (core/update_install.py refuse d'installer un asset absent de ce fichier).
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          rm -f SHA256SUMS
          find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | xargs -d '\n' sha256sum > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
          RELEASE_NAME: ${{ needs.release-metadata.outputs.release_name }}
          CHANNEL: ${{ needs.release-metadata.outputs.channel }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          previous_tag=""
          if [ "$CHANNEL" = "unstable" ]; then
            previous_tag="$(gh release list --limit 100 --json tagName,isPrerelease \
              --jq '[.[] | select(.isPrerelease == true and (.tagName | test("-unstable\\.")))][0].tagName // ""')"
          else
            previous_tag="$(gh release list --limit 100 --json tagName,isPrerelease \
              --jq '[.[] | select(.isPrerelease == false and (.tagName | startswith("v")))][0].tagName // ""')"
          fi

          if [ -z "$previous_tag" ]; then
            # tags de l'app uniquement (muxiveo-rife-v* a ses propres releases)
            previous_tag="$(gh release list --limit 100 --json tagName \
              --jq '[.[] | select(.tagName | startswith("v"))][0].tagName // ""')"
          fi

          range=""
          if [ -n "$previous_tag" ] && git rev-parse -q --verify "refs/tags/$previous_tag" >/dev/null; then
            range="${previous_tag}..HEAD"
          fi

          if [ -n "$range" ]; then
            git log "$range" --no-merges --pretty=format:'- %s (%h)' | sed '/^- $/d' > commits.md
          else
            git log --no-merges --pretty=format:'- %s (%h)' | sed '/^- $/d' > commits.md
          fi

          if [ ! -s commits.md ]; then
            printf '%s\n' '- No commit found since the previous release.' > commits.md
          fi

          win_installer=""
          linux_appimage=""
          macos_dmg=""

          for f in artifacts/*; do
            [ -f "$f" ] || continue
            fname="$(basename "$f")"
            case "$fname" in
              Muxiveo-Setup-AllInc-*.exe|*allinc*.exe)
                win_installer="$fname"
                ;;
              *.AppImage)
                if [[ "$fname" != *.zsync ]]; then
                  linux_appimage="$fname"
                fi
                ;;
              *.dmg)
                macos_dmg="$fname"
                ;;
            esac
          done

          if [ -z "$win_installer" ]; then
            for f in artifacts/*; do
              [ -f "$f" ] || continue
              fname="$(basename "$f")"
              case "$fname" in
                Muxiveo-Setup-*.exe)
                  win_installer="$fname"
                  ;;
              esac
            done
          fi

          base_download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"

          {
            echo "# ${RELEASE_NAME}"
            echo
            if [ -n "$win_installer" ] || [ -n "$linux_appimage" ] || [ -n "$macos_dmg" ]; then
              echo "### 📥 Téléchargements / Direct Downloads"
              echo
              if [ -n "$win_installer" ]; then
                echo "- 🪟 **Windows (Allinc setup)** : [${win_installer}](${base_download_url}/${win_installer})"
              fi
              if [ -n "$linux_appimage" ]; then
                echo "- 🐧 **Linux (AppImage)** : [${linux_appimage}](${base_download_url}/${linux_appimage})"
              fi
              if [ -n "$macos_dmg" ]; then
                echo "- 🍏 **macOS (DMG)** : [${macos_dmg}](${base_download_url}/${macos_dmg})"
              fi
              echo
              echo "---"
              echo
            fi
            echo "- Channel: ${CHANNEL}"
            echo "- Commit: ${GITHUB_SHA}"
            if [ -n "$previous_tag" ]; then
              echo "- Previous release: ${previous_tag}"
            else
              echo "- Previous release: none found"
            fi
            echo
            echo "## Changes since previous release"
            echo
            cat commits.md
            echo
          } > release-body.md

      - name: Create release when needed, then upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
          RELEASE_NAME: ${{ needs.release-metadata.outputs.release_name }}
          PRERELEASE: ${{ needs.release-metadata.outputs.prerelease }}
          CHANNEL: ${{ needs.release-metadata.outputs.channel }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          mapfile -t files < <(find artifacts -maxdepth 1 -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release asset found under artifacts/" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; uploading assets and updating notes."
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
            edit_args=(--title "$RELEASE_NAME" --notes-file release-body.md)
            if [ "$CHANNEL" = "stable" ]; then
              edit_args+=(--latest)
            fi
            if [ "$PRERELEASE" = "true" ]; then
              edit_args+=(--prerelease)
            fi
            is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft // false')"
            if [ "$is_draft" = "true" ]; then
              edit_args+=(--draft=false)
            fi
            gh release edit "$RELEASE_TAG" "${edit_args[@]}"
          else
            create_args=()
            if [ "$PRERELEASE" = "true" ]; then
              create_args+=(--prerelease)
            else
              create_args+=(--latest)
            fi
            gh release create "$RELEASE_TAG" \
              "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_NAME" \
              --notes-file release-body.md \
              "${create_args[@]}"
          fi

  publish-homebrew-tap:
    name: Publish Homebrew tap
    runs-on: ubuntu-latest
    needs:
      - release-metadata
      - release
    if: ${{ needs.release-metadata.outputs.channel == 'stable' && (github.ref_name == 'main' || github.ref_type == 'tag') }}
    steps:
      - name: Download formula artifact
        uses: actions/download-artifact@v4
        with:
          name: homebrew-formula
          path: release-assets/formula

      - name: Publish formula to tap repository
        env:
          TAP_REPO: ${{ env.HOMEBREW_TAP_REPO }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release-metadata.outputs.package_version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN absent, skipping tap publication."
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" homebrew-tap
          mkdir -p homebrew-tap/Formula
          cp release-assets/formula/Muxiveo.rb homebrew-tap/Formula/Muxiveo.rb
          cd homebrew-tap
          if [ -z "$(git status --porcelain Formula/Muxiveo.rb)" ]; then
            echo "Formula unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/Muxiveo.rb
          git commit -m "Muxiveo ${VERSION}"
          git push
