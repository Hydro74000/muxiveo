name: muxiveo-mvtools

on:
  push:
    branches: ["**"]
    paths: ["native/muxiveo-mvtools/**", "tests/native/test_muxiveo_mvtools.py", ".github/workflows/muxiveo-mvtools.yml"]
    tags: ["muxiveo-mvtools-v*"]
  pull_request:
    paths: ["native/muxiveo-mvtools/**", "tests/native/test_muxiveo_mvtools.py", ".github/workflows/muxiveo-mvtools.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mvtools-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            exe: muxiveo-mvtools
          - os: windows-2022
            platform: windows-x86_64
            exe: muxiveo-mvtools.exe
          - os: macos-14
            platform: macos-arm64
            exe: muxiveo-mvtools
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        shell: bash
        run: python -m pip install meson==1.12.1 ninja pytest numpy psutil
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Windows assembler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --yes --no-progress
          "C:\Program Files\NASM" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: macOS toolchain
        if: runner.os == 'macOS'
        run: brew install pkg-config
      - name: Build (Windows/macOS)
        if: runner.os != 'Linux'
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: python native/muxiveo-mvtools/scripts/build.py --jobs 4
      - name: Build (glibc 2.28)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm -v "$PWD:/src" -w /src quay.io/pypa/manylinux_2_28_x86_64 bash -euc '
            export PATH=/opt/python/cp312-cp312/bin:$PATH
            dnf install -y nasm
            python -m pip install meson==1.12.1 ninja cmake patchelf
            python native/muxiveo-mvtools/scripts/build.py --jobs 4'
          sudo chown -R "$(id -u):$(id -g)" build
          python native/muxiveo-mvtools/scripts/check_abi.py build/muxiveo-mvtools/bundle
      - name: Version and isolated runtime
        shell: bash
        run: |
          python -c 'from pathlib import Path; from core.version import MUXIVEO_MVTOOLS_VERSION as v; assert f"VERSION {v} " in Path("native/muxiveo-mvtools/CMakeLists.txt").read_text()'
          python -c 'from pathlib import Path; from core.native_mvtools import bundle_errors; errors = bundle_errors(Path("build/muxiveo-mvtools/bundle/${{ matrix.exe }}")); assert not errors, errors'
      - name: Functional tests
        shell: bash
        env:
          MUXIVEO_MVTOOLS_BIN: build/muxiveo-mvtools/bundle/${{ matrix.exe }}
        run: python -m pytest -q --noconftest tests/native/test_muxiveo_mvtools.py
      - name: Baseline CPU (sans AVX2)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user
          qemu-x86_64 -cpu Nehalem build/muxiveo-mvtools/bundle/muxiveo-mvtools --self-test --json
      - name: Qualification synthétique et ressources 4K 10 bits
        shell: bash
        run: |
          python native/muxiveo-mvtools/scripts/benchmark.py --mvtools-bin build/muxiveo-mvtools/bundle/${{ matrix.exe }} --threads 4 --output build/mvtools-assets/${{ matrix.platform }}-quality.json
          python native/muxiveo-mvtools/scripts/benchmark.py --mvtools-bin build/muxiveo-mvtools/bundle/${{ matrix.exe }} --width 3840 --height 2160 --frames 4 --threads 4 --scenes bars --resource-only --output build/mvtools-assets/${{ matrix.platform }}-4k-resources.json
      - name: Archive and corresponding sources
        shell: bash
        run: python native/muxiveo-mvtools/scripts/archive.py --platform ${{ matrix.platform }} ${{ runner.os == 'Linux' && '--sources' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: muxiveo-mvtools-${{ matrix.platform }}
          path: build/mvtools-assets/*
          if-no-files-found: error
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/muxiveo-mvtools-v') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: muxiveo-mvtools-*
          merge-multiple: true
          path: assets
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(python -c 'from core.version import MUXIVEO_MVTOOLS_RELEASE_TAG; print(MUXIVEO_MVTOOLS_RELEASE_TAG)')
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
          (cd assets && sha256sum -- * > SHA256SUMS)
          gh release create "$TAG" assets/* --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "Interpolation CPU MVTools. Runtime autonome, licences et sources correspondantes incluses dans les assets séparés." --latest=false
