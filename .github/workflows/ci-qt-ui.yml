name: Qt UI Tests

# Tests nécessitant PySide6/Qt : widgets, panels, sidebar, i18n, packaging.
# Utilise un display virtuel (Xvfb) pour les tests Qt headless sous Linux.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ui/**"
      - "main.py"
      - "locales.json"
      - "core/i18n.py"
      - "core/config.py"
      - "core/runner.py"
      - "tests/test_remux.py"
      - "tests/test_merge_dovi_panel.py"
      - "tests/test_merge_remux_extras.py"
      - "tests/test_main_window_sidebar.py"
      - "tests/test_main_window_startup_panel.py"
      - "tests/test_dashboard_page.py"
      - "tests/test_settings_panel.py"
      - "tests/test_nfo_generation.py"
      - "tests/test_i18n.py"
      - "tests/test_encode_audio_bitrate_ui.py"
      - "tests/test_encode_panel_widgets.py"
      - "tests/test_package.py"
      - "tests/test_launcher.py"
      - "tests/conftest.py"
      - ".github/workflows/ci-qt-ui.yml"
  push:
    branches:
      - main
      - master
      - rebrand
    paths:
      - "ui/**"
      - "main.py"
      - "locales.json"
      - "core/i18n.py"
      - "core/config.py"
      - "core/runner.py"
      - "tests/test_remux.py"
      - "tests/test_merge_dovi_panel.py"
      - "tests/test_merge_remux_extras.py"
      - "tests/test_main_window_sidebar.py"
      - "tests/test_main_window_startup_panel.py"
      - "tests/test_dashboard_page.py"
      - "tests/test_settings_panel.py"
      - "tests/test_nfo_generation.py"
      - "tests/test_i18n.py"
      - "tests/test_encode_audio_bitrate_ui.py"
      - "tests/test_encode_panel_widgets.py"
      - "tests/test_package.py"
      - "tests/test_launcher.py"
      - "tests/conftest.py"
      - ".github/workflows/ci-qt-ui.yml"

jobs:
  qt-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies
        timeout-minutes: 6
        run: |
          packages=(
            ffmpeg
            libegl1 libgl1 libglib2.0-0t64 libdbus-1-3
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
            libxkbcommon-x11-0 xvfb
          )
          missing=()
          for package in "${packages[@]}"; do
            if [[ "$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)" != "install ok installed" ]]; then
              missing+=("$package")
            fi
          done
          if (( ${#missing[@]} == 0 )); then
            echo "All system dependencies are already installed."
            exit 0
          fi
          echo "Missing system dependencies: ${missing[*]}"

          # Bypass the stalled Azure mirror without altering the runner's sources.
          # https://github.com/actions/runner-images/issues/14594
          sources="$RUNNER_TEMP/qt-ubuntu.sources"
          sed \
            -e 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu/|g' \
            -e 's|http://azure.archive.ubuntu.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g' \
            /etc/apt/sources.list.d/ubuntu.sources > "$sources"
          apt_options=(
            -o "Dir::Etc::sourcelist=$sources"
            -o Dir::Etc::sourceparts=-
            -o Acquire::ForceIPv4=true
            -o Acquire::Retries=1
            -o Acquire::http::Timeout=15
            -o Acquire::https::Timeout=15
            -o DPkg::Lock::Timeout=60
          )
          sudo timeout --kill-after=15s 120s apt-get "${apt_options[@]}" \
            -o APT::Update::Error-Mode=any update
          sudo timeout --kill-after=15s 180s env DEBIAN_FRONTEND=noninteractive \
            apt-get "${apt_options[@]}" install -y --no-install-recommends "${missing[@]}"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          for attempt in 1 2 3; do
            if python -m pip install --retries 5 --timeout 60 pytest pytest-qt "PySide6!=6.12.0" numpy; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Run Qt UI Tests
        env:
          DISPLAY: ":99"
          QT_QPA_PLATFORM: "offscreen"
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          pytest \
            tests/test_remux.py \
            tests/test_merge_dovi_panel.py \
            tests/test_merge_remux_extras.py \
            tests/test_main_window_sidebar.py \
            tests/test_main_window_startup_panel.py \
            tests/test_dashboard_page.py \
            tests/test_settings_panel.py \
            tests/test_nfo_generation.py \
            tests/test_i18n.py \
            tests/test_encode_audio_bitrate_ui.py \
            tests/test_encode_panel_widgets.py \
            tests/test_package.py \
            tests/test_launcher.py \
            -v
