name: Windows Remux Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "core/workflows/remux.py"
      - "core/workflows/remux_models.py"
      - "core/workflows/remux_timeline_sync.py"
      - "core/workflows/common/native_stream_inputs.py"
      - "core/matroska/stream_source.py"
      - "tests/integration/test_native_stream_inputs.py"
      - "tests/test_remux_workflow.py"
      - "tests/test_remux_timeline_sync.py"
      - "scripts/windows_pytest_bootstrap.py"
      - "requirements.txt"
      - "core/python_requirements.py"
      - ".github/workflows/windows-remux-tests.yml"
  push:
    branches:
      - main
      - master
      - rebrand
      - devel-cli
    paths:
      - "core/workflows/remux.py"
      - "core/workflows/remux_models.py"
      - "core/workflows/remux_timeline_sync.py"
      - "core/workflows/common/native_stream_inputs.py"
      - "core/matroska/stream_source.py"
      - "tests/integration/test_native_stream_inputs.py"
      - "tests/test_remux_workflow.py"
      - "tests/test_remux_timeline_sync.py"
      - "scripts/windows_pytest_bootstrap.py"
      - "requirements.txt"
      - "core/python_requirements.py"
      - ".github/workflows/windows-remux-tests.yml"

jobs:
  remux-targeted:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Test Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-qt

      - name: Install FFmpeg master
        uses: ./.github/actions/ffmpeg-master

      - name: Run Targeted Remux Tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/windows_pytest_bootstrap.py tests/test_remux_workflow.py tests/test_remux_timeline_sync.py tests/integration/test_native_stream_inputs.py
