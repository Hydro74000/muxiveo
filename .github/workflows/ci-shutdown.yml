name: Process and UI shutdown

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "core/runner.py"
      - "core/subprocess_utils.py"
      - "core/windows_named_pipe.py"
      - "core/workflows/common/sync_rewrite.py"
      - "core/workflows/remux_timeline_sync.py"
      - "ui/**"
      - "tests/test_process_cancellation.py"
      - "tests/test_windows_named_pipe.py"
      - "tests/test_shutdown_cleanup.py"
      - ".github/workflows/ci-shutdown.yml"
  push:
    branches: [main, master, rebrand, devel-cli]
    paths:
      - "core/runner.py"
      - "core/subprocess_utils.py"
      - "core/windows_named_pipe.py"
      - "core/workflows/common/sync_rewrite.py"
      - "core/workflows/remux_timeline_sync.py"
      - "ui/**"
      - "tests/test_process_cancellation.py"
      - "tests/test_windows_named_pipe.py"
      - "tests/test_shutdown_cleanup.py"
      - ".github/workflows/ci-shutdown.yml"

jobs:
  shutdown:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libdbus-1-3
      - name: Python dependencies
        run: python -m pip install pytest PySide6 numpy
      - name: Cancellation, complete pipe transfer and window shutdown
        run: >-
          python -m pytest -q
          tests/test_process_cancellation.py
          tests/test_windows_named_pipe.py
          tests/test_shutdown_cleanup.py
          tests/test_runner.py
          tests/test_subprocess_utils.py
          tests/test_remux_timeline_sync.py
